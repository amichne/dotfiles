# Starship owns prompt rendering.
"$schema" = "https://starship.rs/config-schema.json"
format = '$directory${custom.worktrunk}$cmd_duration$status$line_break$character'
add_newline = true
command_timeout = 1200

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold blue'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' read-only'

[custom.worktrunk]
command = 'wt list statusline'
require_repo = true
when = 'command -v wt >/dev/null 2>&1'
shell = ['sh']
format = '$output '

[cmd_duration]
min_time = 1500
format = '[took $duration](bright-black) '

[status]
disabled = false
format = '[exit:$status](red) '

[character]
success_symbol = '[\$](green)'
error_symbol = '[\$](red)'
vimcmd_symbol = '[❮](green)'
