min_version = "2026.9.1"

[settings]
auto_install = false
not_found_auto_install = false
not_found_system_fallback = false
pin = true
# Setup handles each install itself; never pre-install the entire tool list.
task.run_auto_install = false

[vars]
setup_brewfile = "../../Brewfile"

[tasks."setup:plan"]
description = "Preview the global tool inventory without installing anything"
run = '"$MISE_TASK_DIR/../../.local/bin/setup-tools" --config "$MISE_TASK_FILE"'

[tasks.setup]
description = "Install missing tools independently; report issues and continue"
run = '"$MISE_TASK_DIR/../../.local/bin/setup-tools" --config "$MISE_TASK_FILE" --apply'

[tasks."setup:strict"]
description = "Attempt every install; exit nonzero if setup is incomplete"
run = '"$MISE_TASK_DIR/../../.local/bin/setup-tools" --config "$MISE_TASK_FILE" --apply --strict'

[tools]
# Projects can override either compiler toolchain.
java = "temurin-25.0.5.1+2.0.LTS"
kotlin = { version = "2.4.21", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
