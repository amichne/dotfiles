min_version = "2026.9.1"

[settings]
auto_install = false
not_found_auto_install = false
not_found_system_fallback = false
pin = true
# Setup handles each install itself; never pre-install the entire tool list.
task.run_auto_install = false

[vars]
# System dependencies only; keep mise-managed tools in [tools].
# Whitespace-separated formula/cask names. Empty casks means no GUI app installs.
setup_brew_formulae = """
git neovim shellcheck zsh
zsh-autosuggestions zsh-completions zsh-syntax-highlighting
"""
setup_brew_casks = ""

[tasks."setup:plan"]
description = "Preview the global tool inventory without installing anything"
run = 'uv run --offline --locked --script "{{env.HOME}}/.local/bin/setup-tools"'

[tasks.setup]
description = "Install missing tools independently; report issues and continue"
run = 'uv run --offline --locked --script "{{env.HOME}}/.local/bin/setup-tools" --apply'

[tasks."setup:strict"]
description = "Attempt every install; exit nonzero if setup is incomplete"
run = 'uv run --offline --locked --script "{{env.HOME}}/.local/bin/setup-tools" --apply --strict'

[tools]
# Shell integrations, with one prompt owner.
starship = "1.26.0"
atuin = "18.23.0"
zoxide = "0.10.0"
worktrunk = "0.81.0"

# Small toolbox for Developer Tools workflows.
ripgrep = "15.2.0"
fd = "10.3.0"
jq = "1.8.2"
fzf = "0.74.3"
gh = "2.100.0"
uv = "0.12.9"
eza = "0.23.5"
yazi = "26.9.1"
bat = "0.26.1"
acli = "1.3.39-stable"

# Language servers used by pi-lsp: Python (typing + lint/fixes), JS/TS.
ty = "0.0.83"
ruff = "0.16.8"
biome = "2.5.14"

# Match the currently selected local runtime versions. Repositories may override.
java = "temurin-25.0.2+10.0.LTS"
node = "26.0.0"
# Kotlin uses mise for compiler selection.
kotlin = "2.1.21"
