[desktop]
preventSleepWhileRunning = true
git-branch-prefix = "feature/"
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
git-pr-instructions = """
Details, minimal links, no more than a single page. You cover what , why, not how; that's the code.

Any callouts/risks/uncertainty should be explicitly called out ahead of time """
git-commit-instructions = """
1. First line: conventional commit format (type: concise description) (remember to use semantic types like feat, fix, docs, style, refactor, perf, test, chore, etc.)
2. Optional bullet points if more context helps:
   - Keep the second line blank
   - Keep them short and direct
   - Focus on what changed
   - Always be terse
   - Don't overly explain
   - Drop any fluffy or formal language

Return ONLY the commit message - no introduction, no explanation, no quotes around it."""
followUpQueueMode = "steer"
show-context-window-usage = true
appearanceTheme = "dark"
appearanceDarkCodeThemeId = "dracula"
keepRemoteControlAwakeWhilePluggedIn = true
