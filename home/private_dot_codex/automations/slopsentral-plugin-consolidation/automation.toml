prompt = "Audit the slopsentral marketplace-source repository for concrete improvements to focused plugins, skills, hooks, and plugin composition. Treat source/adaptable.marketplace.json as the source-of-truth marketplace contract, and treat .agents/plugins and .github/plugin as generated provider outputs unless the repository documents otherwise. Focus on trigger ambiguity, incorrect or overlapping plugin ownership, unclear usage boundaries, duplicated workstream ownership, mixed concerns, stale or inconsistent conversation-history capture, and plugin/skill/hook units that should be split, narrowed, renamed, moved, or consolidated. Back every proposed change with concrete file evidence and an explicit rationale; do not make style-only or preference-only changes. Preserve unrelated work and avoid editing generated output by hand when a source/regeneration path exists. Prefer structural changes that make ownership and trigger routing verifiable: narrower trigger language, clearer plugin boundaries, manifest references that match ownership, removed duplicated claims, and updated docs or instructions only where needed to keep the contract coherent. Run the repo's available validation before and after meaningful edits, including marketplace/source validation and provider materialization checks when available. If concrete improvements are warranted, create a branch, commit only the scoped changes, push it, and open a pull request whose description lists the evidence, the consolidation rationale, validation performed, and any residual risks. If no PR is warranted, report the audited surfaces, evidence reviewed, proposed consolidations rejected, validation results, and the reason no changes were made."
