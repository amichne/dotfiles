name: Sandbox

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Disposable container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          python-version: "3.12.14"
          enable-cache: false
      - name: Run disposable container gate
        run: uv run --locked --script scripts/sandbox.py check

  pi-types:
    name: Pi TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
      - name: Prepare pinned Pi declarations and TypeScript
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-types" --no-save --ignore-scripts \
            @earendil-works/pi-coding-agent@1.3.0 \
            typescript@7.0.2 @types/node@26.6.5
      - name: Examine Pi extension types
        run: |
          export PI_SDK_ROOT="$RUNNER_TEMP/pi-types/node_modules/@earendil-works/pi-coding-agent"
          export TYPESCRIPT_ROOT="$RUNNER_TEMP/pi-types/node_modules/typescript"
          node --test tests/pi-types.test.mjs
