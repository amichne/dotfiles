[project]
name = "config-upstream-proof"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==8.4.2"]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.9"
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["standalone.py", "test_source_archive.py"]
exclude = ["**/fixtures", "**/.venv"]
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportUnusedCallResult = "error"
reportPrivateUsage = "error"

[tool.ruff]
respect-gitignore = false
target-version = "py312"
line-length = 100
include = ["*.py"]
extend-exclude = ["**/fixtures"]

[tool.ruff.lint]
select = ["ALL"]
# Documentation style is prose policy; formatter owns line layout. CLI output
# and explicit argv subprocesses are intentional at effect boundaries.
ignore = ["D", "COM812", "ISC001", "E501", "T201", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]
"**/standalone.py" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["."]
python_files = ["test_*.py", "standalone.py"]
filterwarnings = ["error"]
